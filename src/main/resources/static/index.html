<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNMP Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #333; }
  header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.2rem; }
  nav { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  nav button { background: transparent; color: #ccc; border: 1px solid #444; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: .85rem; }
  nav button.active, nav button:hover { background: #16213e; color: #fff; border-color: #4fc3f7; }
  .user-info { color: #aaa; font-size: .8rem; margin-right: 8px; }
  .btn-logout { background: transparent; color: #ef9a9a !important; border-color: #555 !important; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  section { display: none; }
  section.active { display: block; }
  h2 { font-size: .85rem; color: #888; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  th { background: #1a1a2e; color: #ccc; text-align: left; padding: 10px 14px; font-size: .8rem; }
  td { padding: 10px 14px; border-bottom: 1px solid #eee; font-size: .9rem; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 600; }
  .badge.ok   { background: #e8f5e9; color: #2e7d32; }
  .badge.off  { background: #eee; color: #888; }
  .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: .85rem; }
  .btn-primary { background: #1565c0; color: #fff; }
  .btn-danger  { background: #c62828; color: #fff; }
  .btn-sm { padding: 3px 8px; font-size: .8rem; }
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  dialog { border: none; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.2); padding: 0; min-width: 360px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dialog-header { background: #1a1a2e; color: #fff; padding: 14px 20px; border-radius: 8px 8px 0 0; font-size: 1rem; }
  .dialog-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .dialog-footer { padding: 12px 20px; text-align: right; border-top: 1px solid #eee; display: flex; gap: 8px; justify-content: flex-end; }
  label { font-size: .85rem; color: #555; }
  input[type=text], input[type=password], input[type=number], select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: .9rem; margin-top: 4px; }
  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .pct-bar { display: inline-block; width: 80px; height: 8px; background: #eee; border-radius: 4px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .pct-fill { height: 100%; border-radius: 4px; }
  .alert-triggered { color: #c62828; font-weight: 600; }
  .alert-resolved  { color: #2e7d32; }
  .hint { font-size: .8rem; color: #e65100; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <span>📡</span>
  <h1>SNMP Monitor</h1>
  <nav>
    <button class="active" onclick="showTab('status', this)">狀態</button>
    <button onclick="showTab('devices', this)">設備管理</button>
    <button onclick="showTab('alerts', this)">告警記錄</button>
    <button onclick="showTab('users', this)">帳號管理</button>
    <span class="user-info" id="user-info"></span>
    <button class="btn-logout" onclick="logout()">登出</button>
  </nav>
</header>

<main>

  <!-- 狀態 -->
  <section id="tab-status" class="active">
    <h2>各設備目前狀態（每 30 秒自動更新）</h2>
    <table>
      <thead><tr><th>設備</th><th>CPU</th><th>記憶體</th><th>磁碟</th></tr></thead>
      <tbody id="status-body"><tr><td colspan="4" style="color:#aaa">載入中...</td></tr></tbody>
    </table>
  </section>

  <!-- 設備管理 -->
  <section id="tab-devices">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openDeviceDialog()">＋ 新增設備</button>
    </div>
    <h2>設備清單</h2>
    <table>
      <thead><tr><th>名稱</th><th>IP / Host</th><th>Port</th><th>Community</th><th>狀態</th><th>操作</th></tr></thead>
      <tbody id="devices-body"><tr><td colspan="6" style="color:#aaa">載入中...</td></tr></tbody>
    </table>
  </section>

  <!-- 告警記錄 -->
  <section id="tab-alerts">
    <h2>最近告警記錄</h2>
    <table>
      <thead><tr><th>時間</th><th>設備</th><th>指標</th><th>事件</th><th>數值</th><th>閾值</th></tr></thead>
      <tbody id="alerts-body"><tr><td colspan="6" style="color:#aaa">載入中...</td></tr></tbody>
    </table>
  </section>

  <!-- 帳號管理 -->
  <section id="tab-users">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openUserDialog()">＋ 新增帳號</button>
    </div>
    <h2>帳號清單</h2>
    <table>
      <thead><tr><th>帳號</th><th>角色</th><th>狀態</th><th>建立時間</th><th>操作</th></tr></thead>
      <tbody id="users-body"><tr><td colspan="5" style="color:#aaa">載入中...</td></tr></tbody>
    </table>
  </section>

</main>

<!-- 設備 Dialog -->
<dialog id="device-dialog">
  <div class="dialog-header" id="device-dialog-title">新增設備</div>
  <div class="dialog-body">
    <input type="hidden" id="d-id">
    <label>設備名稱 * <input type="text" id="d-name" placeholder="Server-01"></label>
    <label>IP / Hostname * <input type="text" id="d-host" placeholder="192.168.1.10"></label>
    <label>SNMP Port <input type="number" id="d-port" value="161" min="1" max="65535"></label>
    <label>Community String <input type="text" id="d-community" value="public"></label>
    <label><div class="toggle"><input type="checkbox" id="d-enabled" checked><span>啟用監控</span></div></label>
  </div>
  <div class="dialog-footer">
    <button class="btn" onclick="closeDialog('device-dialog')">取消</button>
    <button class="btn btn-primary" onclick="saveDevice()">儲存</button>
  </div>
</dialog>

<!-- 帳號 Dialog -->
<dialog id="user-dialog">
  <div class="dialog-header" id="user-dialog-title">新增帳號</div>
  <div class="dialog-body">
    <input type="hidden" id="u-id">
    <label>帳號名稱 * <input type="text" id="u-username" placeholder="operator"></label>
    <div id="u-password-section">
      <label>密碼 * <input type="password" id="u-password" placeholder="至少 6 字元"></label>
    </div>
    <label>角色
      <select id="u-role"><option value="admin">admin</option></select>
    </label>
    <label><div class="toggle"><input type="checkbox" id="u-enabled" checked><span>啟用</span></div></label>
  </div>
  <div class="dialog-footer">
    <button class="btn" onclick="closeDialog('user-dialog')">取消</button>
    <button class="btn btn-primary" onclick="saveUser()">儲存</button>
  </div>
</dialog>

<!-- 修改密碼 Dialog -->
<dialog id="pwd-dialog">
  <div class="dialog-header">修改密碼</div>
  <div class="dialog-body">
    <input type="hidden" id="pwd-id">
    <label>新密碼 * <input type="password" id="pwd-new" placeholder="至少 6 字元"></label>
    <label>確認密碼 * <input type="password" id="pwd-confirm" placeholder="再輸入一次"></label>
    <div class="hint" id="pwd-hint"></div>
  </div>
  <div class="dialog-footer">
    <button class="btn" onclick="closeDialog('pwd-dialog')">取消</button>
    <button class="btn btn-primary" onclick="savePassword()">儲存</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);

// ── 初始化 ────────────────────────────────────────────────────────
(async () => {
  const res = await fetch('/api/auth/me');
  if (!res.ok) { window.location.href = '/login.html'; return; }
  const user = await res.json();
  $('user-info').textContent = `👤 ${user.username}`;
  loadStatus();
  setInterval(loadStatus, 30000);
})();

// ── Tab 切換 ──────────────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  $('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'status')  loadStatus();
  if (name === 'devices') loadDevices();
  if (name === 'alerts')  loadAlerts();
  if (name === 'users')   loadUsers();
}

// ── 登出 ──────────────────────────────────────────────────────────
async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

// ── 共用工具 ──────────────────────────────────────────────────────
function closeDialog(id) { $(id).close(); }

function pctBar(pct) {
  const p = pct.toFixed(1);
  const color = pct >= 90 ? '#e53935' : pct >= 75 ? '#fb8c00' : '#43a047';
  return `<span class="pct-bar"><span class="pct-fill" style="width:${p}%;background:${color}"></span></span>${p}%`;
}

// ── 狀態 ─────────────────────────────────────────────────────────
async function loadStatus() {
  const data = await fetch('/api/status').then(r => r.json()).catch(() => []);
  const tb = $('status-body');
  if (!data.length) { tb.innerHTML = '<tr><td colspan="4" style="color:#aaa">尚無資料</td></tr>'; return; }
  tb.innerHTML = data.map(d => `<tr>
    <td><strong>${d.deviceName}</strong></td>
    <td>${d.cpu ? pctBar(d.cpu.usedPct) : '—'}</td>
    <td>${d.memory ? pctBar(d.memory.usedPct) : '—'}</td>
    <td>${d.disks && d.disks.length ? d.disks.map(k => `${k.mountPoint} ${pctBar(k.usedPct)}`).join('<br>') : '—'}</td>
  </tr>`).join('');
}

// ── 設備管理 ──────────────────────────────────────────────────────
async function loadDevices() {
  const data = await fetch('/api/devices').then(r => r.json()).catch(() => []);
  const tb = $('devices-body');
  if (!data.length) { tb.innerHTML = '<tr><td colspan="6" style="color:#aaa">尚無設備</td></tr>'; return; }
  tb.innerHTML = data.map(d => `<tr>
    <td><strong>${d.name}</strong></td><td>${d.host}</td><td>${d.port}</td>
    <td><code>${d.community}</code></td>
    <td><span class="badge ${d.enabled ? 'ok' : 'off'}">${d.enabled ? '啟用' : '停用'}</span></td>
    <td>
      <button class="btn btn-sm btn-primary" onclick='openDeviceDialog(${JSON.stringify(d)})'>編輯</button>
      <button class="btn btn-sm btn-danger"  onclick="deleteDevice(${d.id},'${d.name}')">刪除</button>
    </td>
  </tr>`).join('');
}

function openDeviceDialog(d = null) {
  $('device-dialog-title').textContent = d ? '編輯設備' : '新增設備';
  $('d-id').value        = d ? d.id : '';
  $('d-name').value      = d ? d.name : '';
  $('d-host').value      = d ? d.host : '';
  $('d-port').value      = d ? d.port : 161;
  $('d-community').value = d ? d.community : 'public';
  $('d-enabled').checked = d ? d.enabled : true;
  $('device-dialog').showModal();
}

async function saveDevice() {
  const id   = $('d-id').value;
  const body = { name: $('d-name').value.trim(), host: $('d-host').value.trim(),
                 port: parseInt($('d-port').value), community: $('d-community').value.trim(),
                 enabled: $('d-enabled').checked };
  if (!body.name || !body.host) { alert('名稱和 IP 為必填'); return; }
  const res = await fetch(id ? `/api/devices/${id}` : '/api/devices',
    { method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (res.ok) { closeDialog('device-dialog'); loadDevices(); }
  else { const e = await res.json(); alert(e.error || '儲存失敗'); }
}

async function deleteDevice(id, name) {
  if (!confirm(`確定要刪除「${name}」嗎？`)) return;
  const res = await fetch(`/api/devices/${id}`, { method: 'DELETE' });
  if (res.ok) loadDevices();
  else alert('刪除失敗');
}

// ── 告警記錄 ──────────────────────────────────────────────────────
async function loadAlerts() {
  const data = await fetch('/api/alerts?limit=100').then(r => r.json()).catch(() => []);
  const tb = $('alerts-body');
  if (!data.length) { tb.innerHTML = '<tr><td colspan="6" style="color:#aaa">尚無記錄</td></tr>'; return; }
  tb.innerHTML = data.map(a => `<tr>
    <td style="white-space:nowrap">${a.ts.replace('T',' ').substring(0,19)}</td>
    <td>${a.deviceName}</td><td>${a.metricName}</td>
    <td class="${a.eventType==='TRIGGERED'?'alert-triggered':'alert-resolved'}">${a.eventType}</td>
    <td>${a.value.toFixed(1)}%</td><td>${a.thresholdVal.toFixed(1)}%</td>
  </tr>`).join('');
}

// ── 帳號管理 ──────────────────────────────────────────────────────
async function loadUsers() {
  const data = await fetch('/api/users').then(r => r.json()).catch(() => []);
  const tb = $('users-body');
  if (!data.length) { tb.innerHTML = '<tr><td colspan="5" style="color:#aaa">尚無帳號</td></tr>'; return; }
  tb.innerHTML = data.map(u => `<tr>
    <td><strong>${u.username}</strong></td>
    <td>${u.role}</td>
    <td><span class="badge ${u.enabled ? 'ok' : 'off'}">${u.enabled ? '啟用' : '停用'}</span></td>
    <td style="font-size:.8rem;color:#aaa">${u.created.substring(0,10)}</td>
    <td>
      <button class="btn btn-sm btn-primary" onclick='openUserDialog(${JSON.stringify(u)})'>編輯</button>
      <button class="btn btn-sm" style="background:#546e7a;color:#fff" onclick="openPwdDialog(${u.id})">改密碼</button>
      <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id},'${u.username}')">刪除</button>
    </td>
  </tr>`).join('');
}

function openUserDialog(u = null) {
  $('user-dialog-title').textContent = u ? '編輯帳號' : '新增帳號';
  $('u-id').value         = u ? u.id : '';
  $('u-username').value   = u ? u.username : '';
  $('u-role').value       = u ? u.role : 'admin';
  $('u-enabled').checked  = u ? u.enabled : true;
  $('u-password-section').style.display = u ? 'none' : 'block'; // 編輯時不顯示密碼欄
  $('user-dialog').showModal();
}

async function saveUser() {
  const id   = $('u-id').value;
  const body = { username: $('u-username').value.trim(), role: $('u-role').value,
                 enabled: $('u-enabled').checked };
  if (!id) body.password = $('u-password').value;
  if (!body.username) { alert('帳號為必填'); return; }
  if (!id && (!body.password || body.password.length < 6)) { alert('密碼至少 6 字元'); return; }
  const res = await fetch(id ? `/api/users/${id}` : '/api/users',
    { method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (res.ok) { closeDialog('user-dialog'); loadUsers(); }
  else { const e = await res.json(); alert(e.error || '儲存失敗'); }
}

function openPwdDialog(id) {
  $('pwd-id').value = id;
  $('pwd-new').value = '';
  $('pwd-confirm').value = '';
  $('pwd-hint').textContent = '';
  $('pwd-dialog').showModal();
}

async function savePassword() {
  const id  = $('pwd-id').value;
  const pwd = $('pwd-new').value;
  const cfm = $('pwd-confirm').value;
  if (pwd.length < 6)  { $('pwd-hint').textContent = '密碼至少 6 字元'; return; }
  if (pwd !== cfm)     { $('pwd-hint').textContent = '兩次密碼不一致'; return; }
  const res = await fetch(`/api/users/${id}/password`,
    { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pwd }) });
  if (res.ok) { closeDialog('pwd-dialog'); alert('密碼已更新'); }
  else { const e = await res.json(); alert(e.error || '更新失敗'); }
}

async function deleteUser(id, username) {
  if (!confirm(`確定要刪除帳號「${username}」嗎？`)) return;
  const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
  if (res.ok) loadUsers();
  else { const e = await res.json(); alert(e.error || '刪除失敗'); }
}
</script>
</body>
</html>
