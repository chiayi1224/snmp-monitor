<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNMP Monitor — 登入</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #1a1a2e; border-radius: 12px; padding: 40px; width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .logo { text-align: center; font-size: 2rem; margin-bottom: 8px; }
  h1 { text-align: center; color: #fff; font-size: 1.2rem; margin-bottom: 32px; font-weight: 400; letter-spacing: 1px; }
  label { display: block; color: #aaa; font-size: .8rem; margin-bottom: 4px; }
  input { width: 100%; padding: 10px 12px; background: #0f0f1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: .95rem; margin-bottom: 16px; outline: none; }
  input:focus { border-color: #4fc3f7; }
  button { width: 100%; padding: 12px; background: #1565c0; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
  button:hover { background: #1976d2; }
  .error { color: #ef5350; font-size: .85rem; text-align: center; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">📡</div>
  <h1>SNMP Monitor</h1>
  <label>帳號</label>
  <input type="text" id="username" placeholder="admin" autofocus>
  <label>密碼</label>
  <input type="password" id="password" placeholder="••••••">
  <button onclick="login()">登入</button>
  <div class="error" id="error-msg"></div>
</div>
<script>
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('error-msg');
    errEl.textContent = '';

    if (!username || !password) { errEl.textContent = '請輸入帳號和密碼'; return; }

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.status === 202) {
      window.location.href = '/change-password.html';
    } else if (res.ok) {
      window.location.href = '/index.html';
    } else {
      const data = await res.json();
      errEl.textContent = data.error || '登入失敗';
    }
  }
</script>
</body>
</html>
