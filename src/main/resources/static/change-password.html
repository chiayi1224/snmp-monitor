<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNMP Monitor — 請修改密碼</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #1a1a2e; border-radius: 12px; padding: 40px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .logo { text-align: center; font-size: 2rem; margin-bottom: 8px; }
  h1 { text-align: center; color: #fff; font-size: 1.1rem; margin-bottom: 6px; }
  .notice { text-align: center; color: #fb8c00; font-size: .85rem; margin-bottom: 28px; }
  label { display: block; color: #aaa; font-size: .8rem; margin-bottom: 4px; margin-top: 14px; }
  input { width: 100%; padding: 10px 12px; background: #0f0f1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: .95rem; outline: none; }
  input:focus { border-color: #4fc3f7; }
  .rules { color: #666; font-size: .78rem; margin-top: 6px; line-height: 1.6; }
  .rule { display: flex; align-items: center; gap: 6px; }
  .rule.ok  { color: #43a047; }
  .rule.bad { color: #666; }
  button { width: 100%; padding: 12px; background: #1565c0; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 24px; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  button:not(:disabled):hover { background: #1976d2; }
  .error { color: #ef5350; font-size: .85rem; text-align: center; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>請修改預設密碼</h1>
  <p class="notice">首次登入必須修改密碼才能繼續使用</p>

  <label>新密碼</label>
  <input type="password" id="pwd-new" oninput="checkRules()" placeholder="請輸入新密碼">

  <div class="rules" id="rules" style="margin-top:8px">
    <div class="rule bad" id="r-len">✗ 至少 8 個字元</div>
    <div class="rule bad" id="r-upper">✗ 包含大寫字母</div>
    <div class="rule bad" id="r-number">✗ 包含數字</div>
    <div class="rule bad" id="r-notdefault">✗ 不能與預設密碼相同</div>
  </div>

  <label style="margin-top:16px">確認新密碼</label>
  <input type="password" id="pwd-confirm" oninput="checkRules()" placeholder="再次輸入新密碼">

  <button id="submit-btn" onclick="submitChange()" disabled>確認修改</button>
  <div class="error" id="error-msg"></div>
</div>

<script>
  // 取得目前登入的 user id
  let userId = null;
  (async () => {
    const res = await fetch('/api/auth/me');
    if (!res.ok) { window.location.href = '/login.html'; return; }
    const user = await res.json();
    // 如果已經不需要改密碼，直接進主畫面
    if (!user.mustChange) { window.location.href = '/index.html'; return; }
    userId = user.id;
  })();

  function checkRules() {
    const pwd = document.getElementById('pwd-new').value;
    const cfm = document.getElementById('pwd-confirm').value;

    const rules = {
      'r-len':       pwd.length >= 8,
      'r-upper':     /[A-Z]/.test(pwd),
      'r-number':    /[0-9]/.test(pwd),
      'r-notdefault': pwd !== 'admin' && pwd.length > 0
    };

    let allOk = true;
    for (const [id, ok] of Object.entries(rules)) {
      const el = document.getElementById(id);
      el.className = 'rule ' + (ok ? 'ok' : 'bad');
      el.textContent = (ok ? '✓ ' : '✗ ') + el.textContent.slice(2);
      if (!ok) allOk = false;
    }

    const match = pwd === cfm && pwd.length > 0;
    document.getElementById('submit-btn').disabled = !(allOk && match);
  }

  async function submitChange() {
    const pwd = document.getElementById('pwd-new').value;
    const cfm = document.getElementById('pwd-confirm').value;
    const errEl = document.getElementById('error-msg');
    errEl.textContent = '';

    if (pwd !== cfm) { errEl.textContent = '兩次密碼不一致'; return; }
    if (!userId)     { errEl.textContent = '無法取得帳號資訊，請重新登入'; return; }

    const res = await fetch(`/api/admin/users/${userId}/password`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });

    if (res.ok) {
      window.location.href = '/index.html';
    } else {
      const data = await res.json();
      errEl.textContent = data.error || '修改失敗';
    }
  }
</script>
</body>
</html>
